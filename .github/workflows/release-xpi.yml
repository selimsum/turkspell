name: Package & Release Firefox XPI

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'tr.aff'
      - 'tr.dic'
      - 'dist/**'
      - 'firefox-addon/manifest.json'
      - 'firefox-addon-tdk/manifest.json'
      - 'amo-metadata.json'
      - 'tools/sign_addon.py'
      - 'build/package_addon.py'
      - '.github/workflows/release-xpi.yml'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install System Dependencies (Hunspell)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y hunspell

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Build & Run Test Suite
        run: |
          python build/validate_build.py
          pytest -v

      - name: Determine & Bump Extension Version
        id: bump
        run: |
          BUMP_TYPE="${{ inputs.bump_type || 'auto' }}"
          python tools/bump_version.py --bump-type "$BUMP_TYPE" --repo-owner "${{ github.repository_owner }}" --repo-name "${{ github.event.repository.name }}"

      - name: Package Firefox Extensions (.xpi)
        run: |
          python build/package_addon.py --profile all

      - name: Sign Extension via Mozilla AMO (If Secrets Present)
        id: sign
        env:
          AMO_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$AMO_KEY" ] && [ -n "$AMO_SECRET" ]; then
            echo "Signing Universal profile on AMO..."
            python tools/sign_addon.py --profile universal --version "${{ steps.bump.outputs.version }}"
            echo "Signing TDK profile on AMO..."
            python tools/sign_addon.py --profile tdk --version "${{ steps.bump.outputs.version }}" || echo "Notice: TDK addon signing on AMO pending initial manual submission on AMO Developer Hub."
          else
            echo "AMO secrets not present. Skipping signing step."
          fi

      - name: Verify & Prepare Release Assets
        id: assets
        run: |
          python -c "
          import os, sys, shutil
          from tools.sign_addon import is_signed_xpi

          signed_files = []
          for name, xpi in [('Universal', 'turkspell-addon.xpi'), ('TDK', 'turkspell-tdk-addon.xpi')]:
              if is_signed_xpi(xpi):
                  print(f'OK: {name} ({xpi}) is cryptographically signed by Mozilla.')
                  signed_files.append(xpi)
              else:
                  print(f'Notice: {name} ({xpi}) does not contain Mozilla signatures.')

          # If signed packages exist, publish only signed packages to avoid distributing unverified add-ons
          if signed_files:
              files_to_publish = signed_files
          else:
              # In developer/unsigned runs without AMO keys, provide packages labeled -unsigned
              print('Warning: No signed extensions found. Publishing as unsigned packages.')
              shutil.copyfile('turkspell-addon.xpi', 'turkspell-addon-unsigned.xpi')
              shutil.copyfile('turkspell-tdk-addon.xpi', 'turkspell-tdk-addon-unsigned.xpi')
              files_to_publish = ['turkspell-addon-unsigned.xpi', 'turkspell-tdk-addon-unsigned.xpi']

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('release_files<<EOF\n')
              for f in files_to_publish:
                  out.write(f'{f}\n')
              out.write('EOF\n')
          "

      - name: Commit & Tag New Version
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          TAG_NAME="${{ steps.bump.outputs.tag_name || format('v{0}', steps.bump.outputs.version) }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add firefox-addon/manifest.json firefox-addon-tdk/manifest.json update.json
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "chore: release version ${TAG_NAME} [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
          
          if git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists locally."
          else
            git tag "${TAG_NAME}"
            git push origin "${TAG_NAME}" || echo "Tag ${TAG_NAME} already pushed or exists on remote."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.bump.outputs.tag_name || format('v{0}', steps.bump.outputs.version) }}"
          name: "Release ${{ steps.bump.outputs.tag_name || format('v{0}', steps.bump.outputs.version) }}"
          body: |
            Automated release for version `${{ steps.bump.outputs.tag_name || steps.bump.outputs.version }}` of the Turkspell Firefox dictionary extensions (Universal & TDK 2026).
          files: ${{ steps.assets.outputs.release_files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
