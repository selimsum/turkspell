name: Package & Release Firefox XPI

on:
  push:
    branches:
      - main
    paths:
      - 'tr.aff'
      - 'tr.dic'
      - 'firefox-addon/manifest.json'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine & Bump Extension Version
        id: bump
        run: |
          BUMP_TYPE="${{ inputs.bump_type || 'auto' }}"
          python tools/bump_version.py --bump-type "$BUMP_TYPE" --repo-owner "${{ github.repository_owner }}" --repo-name "${{ github.event.repository.name }}"

      - name: Package Firefox Extension (.xpi)
        run: |
          python build/package_addon.py

      - name: Sign Extension via Mozilla AMO (If Secrets Present)
        id: sign
        env:
          AMO_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$AMO_KEY" ] && [ -n "$AMO_SECRET" ]; then
            echo "Signing extension with Mozilla web-ext..."
            mkdir -p ./signed_dist
            npx web-ext sign \
              --source-dir ./firefox-addon \
              --api-key "$AMO_KEY" \
              --api-secret "$AMO_SECRET" \
              --channel unlisted \
              --artifacts-dir ./signed_dist
            
            SIGNED_FILE=$(ls ./signed_dist/*.xpi | head -n 1)
            if [ -f "$SIGNED_FILE" ]; then
              cp "$SIGNED_FILE" ./turkspell-addon.xpi
              echo "Successfully signed .xpi"
            fi
          else
            echo "AMO secrets not configured. Proceeding with unsigned .xpi package."
          fi

      - name: Commit & Tag New Version
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add firefox-addon/manifest.json update.json
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "chore: release version v${VERSION} [skip ci]"
            git push origin main
          fi
          
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          name: "Release v${{ steps.bump.outputs.version }}"
          body: |
            Automated release for version `v${{ steps.bump.outputs.version }}` of the Turkspell Firefox dictionary extension.
          files: turkspell-addon.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
