name: Benchmark Smoke

on:
  push:
    paths:
      - 'benchmark/**'
      - 'tr.aff'
      - 'tr.dic'
  pull_request:
    paths:
      - 'benchmark/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install hunspell
        run: sudo apt-get update && sudo apt-get install -y hunspell

      - name: Install test deps
        run: python -m pip install pytest

      # NOTE: dataset generation needs raw_data/rejected_words.csv, which is
      # gitignored (corpus-derived). CI regenerates a minimal stand-in from the
      # authority lists so the pipeline itself stays exercised.
      - name: Prepare minimal rejected_words stand-in
        run: |
          if [ ! -f raw_data/rejected_words.csv ]; then
            printf 'word,frequency\nyanliz,547\ndegil,9\ntesekkur,10\n' > raw_data/rejected_words.csv
          fi

      - name: Unit tests
        run: python -m pytest benchmark/test_lexicons.py benchmark/test_mutations.py -v

      - name: Generate dataset (small)
        run: python benchmark/generate_dataset.py --check || python benchmark/generate_dataset.py

      - name: Determinism check
        run: python benchmark/generate_dataset.py --check

      - name: 100-row evaluation smoke
        run: python benchmark/run_benchmark.py --only turkspell --limit 100
