name: CI Test Suite

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install System Dependencies (Hunspell)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y hunspell

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Build Validation
        run: |
          python build/validate_build.py

      - name: Run Pytest (Universal Profile)
        run: |
          pytest -v

      - name: Run Overgeneration Suite (TDK Profile)
        run: |
          TURKSPELL_DICT=dist/turkspell-tdk/tr pytest tests/test_overgeneration.py -v
